<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="今日计划">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>今日计划</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <p class="date-label" id="dateLabel">6月12日 星期五</p>
          <h1 id="pageTitle">今天</h1>
        </div>
        <button class="sync-button" id="refreshPlan" type="button" aria-label="刷新计划">
          <span class="sync-icon" aria-hidden="true">↻</span>
          <span id="syncLabel">08:00 已更新</span>
        </button>
      </header>

      <section class="screen active" id="todayScreen" aria-labelledby="pageTitle">
        <div id="urgentNotice"></div>

        <div class="section-heading">
          <h2>必须完成</h2>
          <span class="count"><strong id="todayCount">3</strong> 项</span>
        </div>
        <div class="task-list" id="todayList"></div>

        <section class="next-section" aria-labelledby="nextTitle">
          <div class="section-heading">
            <h2 id="nextTitle">接下来</h2>
          </div>
          <div id="nextTask"></div>
        </section>

        <section class="countdown-section" aria-labelledby="countdownTitle">
          <div class="section-heading">
            <h2 id="countdownTitle">考试倒计时</h2>
          </div>
          <div class="countdown-grid" id="countdownGrid"></div>
        </section>
      </section>

      <section class="screen" id="scheduleScreen" aria-labelledby="scheduleTitle">
        <div class="screen-heading">
          <h2 id="scheduleTitle">近期日程</h2>
          <p>课程、截止日期和考试集中查看。</p>
        </div>
        <div class="schedule-list" id="scheduleList"></div>
      </section>

      <section class="screen" id="plansScreen" aria-labelledby="plansTitle">
        <div class="screen-heading action-heading">
          <div>
            <h2 id="plansTitle">我的计划</h2>
            <p>考试周结束后也可以继续使用。</p>
          </div>
          <button class="icon-button" id="addPlan" type="button" aria-label="添加计划">＋</button>
        </div>
        <div class="plans-list" id="plansList"></div>
      </section>

      <section class="screen" id="settingsScreen" aria-labelledby="settingsTitle">
        <div class="screen-heading">
          <h2 id="settingsTitle">设置</h2>
          <p>提醒、离线状态与安装方式。</p>
        </div>

        <div class="settings-group">
          <div class="setting-row">
            <div>
              <h3>08:00 日历提醒</h3>
              <p>导入后，iPhone 每天提醒你查看计划。</p>
            </div>
            <button class="text-button" id="downloadReminder" type="button">下载</button>
          </div>
          <div class="setting-row">
            <div>
              <h3>本地完成状态</h3>
              <p>勾选记录只保存在当前设备。</p>
            </div>
            <span class="status-value positive">已开启</span>
          </div>
          <div class="setting-row">
            <div>
              <h3>离线使用</h3>
              <p>首次打开后可在无网络时查看。</p>
            </div>
            <span class="status-value" id="offlineStatus">检查中</span>
          </div>
        </div>

        <div class="install-guide">
          <h2>安装到 iPhone</h2>
          <ol>
            <li>使用 Safari 打开此页面。</li>
            <li>点“分享”，选择“添加到主屏幕”。</li>
            <li>从桌面打开“今日计划”。</li>
          </ol>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-tab="today" type="button">
        <span class="nav-icon" aria-hidden="true">▣</span>
        <span>今天</span>
      </button>
      <button class="nav-item" data-tab="schedule" type="button">
        <span class="nav-icon" aria-hidden="true">□</span>
        <span>日程</span>
      </button>
      <button class="nav-item" data-tab="plans" type="button">
        <span class="nav-icon" aria-hidden="true">☑</span>
        <span>计划</span>
      </button>
      <button class="nav-item" data-tab="settings" type="button">
        <span class="nav-icon" aria-hidden="true">⚙</span>
        <span>设置</span>
      </button>
    </nav>

    <dialog class="plan-dialog" id="planDialog">
      <form method="dialog" class="dialog-card" id="planForm">
        <header>
          <h2>添加计划</h2>
          <button class="dialog-close" value="cancel" aria-label="关闭">×</button>
        </header>
        <label>
          计划名称
          <input id="planTitle" name="title" autocomplete="off" required placeholder="例如：准备期末考试">
        </label>
        <label>
          每天要做的事
          <textarea id="planBody" name="body" rows="6" placeholder="每行写一项任务"></textarea>
        </label>
        <div class="form-grid">
          <label>
            开始日期
            <input id="startDate" name="startDate" type="date" required>
          </label>
          <label>
            持续天数
            <input id="dayCount" name="dayCount" type="number" min="1" max="60" value="7" required>
          </label>
        </div>
        <button class="primary-button" value="default">保存计划</button>
      </form>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
